<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Data Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; position: fixed; inset: 0; }

#ui {
  position: fixed; inset: 0;
  pointer-events: none;
  font-family: 'Courier New', monospace;
}

/* ── controls bar ── */
#controls {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px;
  pointer-events: all;
}

.ctrl {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  padding: 8px 14px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  cursor: pointer;
  outline: none;
  transition: all 0.2s;
}
.ctrl:hover, .ctrl:focus { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.08); }

#city-input { width: 160px; }

#status {
  position: absolute;
  top: 64px; left: 0; right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.25);
  pointer-events: none;
}

/* ── year strip ── */
#year-strip {
  position: absolute;
  bottom: 70px; left: 60px; right: 60px;
  pointer-events: all;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#year-display {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: rgba(255,255,255,0.25);
}

#year-range {
  width: 100%;
  max-width: 500px;
  -webkit-appearance: none;
  appearance: none;
  height: 1px;
  background: rgba(255,255,255,0.1);
  outline: none;
  cursor: pointer;
}
#year-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  cursor: pointer;
}

/* ── data readout ── */
#readout {
  position: absolute;
  bottom: 20px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 32px;
}

.datum {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.dv {
  font-size: 16px;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.7);
  transition: color 0.6s;
}
.dl {
  font-size: 9px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.2);
}

/* ── city label ── */
#city-label {
  position: absolute;
  left: 24px; bottom: 115px;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="controls">
    <input id="city-input" class="ctrl" type="text" placeholder="city..." value="New York" />
    <button class="ctrl" onclick="searchCity()">LOAD</button>
    <button class="ctrl" onclick="randomize()">⟳ RANDOM</button>
    <button class="ctrl" id="play-btn" onclick="togglePlay()">▶ EVOLVE</button>
  </div>
  <div id="status"></div>

  <div id="city-label" id="city-label">—</div>

  <div id="year-strip">
    <div id="year-display">YEAR 2025 — BASELINE</div>
    <input id="year-range" type="range" min="2025" max="2100" value="2025" step="1" />
  </div>

  <div id="readout">
    <div class="datum"><span class="dv" id="d-temp">—</span><span class="dl">TEMP °C</span></div>
    <div class="datum"><span class="dv" id="d-wind">—</span><span class="dl">WIND km/h</span></div>
    <div class="datum"><span class="dv" id="d-dir">—</span><span class="dl">DIRECTION</span></div>
    <div class="datum"><span class="dv" id="d-humid">—</span><span class="dl">HUMIDITY %</span></div>
    <div class="datum"><span class="dv" id="d-cloud">—</span><span class="dl">CLOUD %</span></div>
    <div class="datum"><span class="dv" id="d-precip">—</span><span class="dl">PRECIP mm</span></div>
    <div class="datum"><span class="dv" id="d-delta">+0.0°</span><span class="dl">Δ WARMING</span></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════
// WORLD CITIES for randomize
// ═══════════════════════════════════════════
const CITIES = [
  'Tokyo','London','Lagos','São Paulo','Mumbai','Cairo','Sydney','Moscow',
  'Chicago','Dubai','Bangkok','Toronto','Berlin','Seoul','Nairobi','Jakarta',
  'Buenos Aires','Istanbul','Mexico City','Oslo','Reykjavik','Phoenix',
  'Singapore','Cape Town','Karachi','Lima','Bogotá','Dhaka','Manila','Tehran',
  'Riyadh','Baghdad','Kabul','Accra','Dakar','Casablanca','Kinshasa','Addis Ababa',
  'Johannesburg','Vancouver','Montreal','Havana','Santiago','Caracas','Quito',
  'Helsinki','Warsaw','Prague','Vienna','Zurich','Madrid','Lisbon','Rome',
  'Athens','Kyiv','Tashkent','Almaty','Ulaanbaatar','Yangon','Hanoi','Colombo'
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let year = 2025;
let playing = false;
let playTimer = null;

let base = { temp: 14, wind: 18, windDir: 225, humidity: 68, clouds: 55, precip: 0.4 };
let rendered = { ...base }; // smoothly interpolated

// Climate projection (IPCC SSP2-4.5 rough)
const WARM_PER_YEAR  = 0.034;
const WIND_SCALE     = 0.0012;
const PRECIP_SCALE   = 0.004;

function project(field, y) {
  const d = y - 2025;
  switch(field) {
    case 'temp':    return base.temp    + d * WARM_PER_YEAR;
    case 'wind':    return base.wind    * (1 + d * WIND_SCALE);
    case 'precip':  return base.precip  * (1 + d * PRECIP_SCALE);
    default:        return base[field];
  }
}

function target() {
  return {
    temp:    project('temp', year),
    wind:    project('wind', year),
    windDir: base.windDir,
    humidity:base.humidity,
    clouds:  base.clouds,
    precip:  project('precip', year),
  };
}

// Smooth interpolation toward target
function lerpState() {
  const t = target();
  const k = 0.04;
  for (const f in rendered) {
    rendered[f] += (t[f] - rendered[f]) * k;
  }
}

// ═══════════════════════════════════════════
// NOISE
// ═══════════════════════════════════════════
function sn(x, y, t) {
  return (
    Math.sin(x * 1.4 + t * 0.9) * Math.cos(y * 1.2 - t * 0.6) * 0.45 +
    Math.sin(x * 3.1 - t * 1.3 + y * 0.8) * 0.28 +
    Math.cos(x * 0.7 + y * 2.4 + t * 0.4) * 0.18 +
    Math.sin(x * 5.3 - y * 4.1 + t * 2.1) * 0.09
  );
}

// ═══════════════════════════════════════════
// FLOATING DATA PARTICLES
// ═══════════════════════════════════════════
class DataParticle {
  constructor() { this.init(); }
  init() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.alpha = 0;
    this.targetAlpha = 0.05 + Math.random() * 0.12;
    this.life = 0;
    this.maxLife = 200 + Math.random() * 300;
    // pick a data field to display
    const fields = ['temp','wind','windDir','humidity','clouds','precip'];
    this.field = fields[Math.floor(Math.random() * fields.length)];
    this.size = 9 + Math.random() * 8;
  }
  update() {
    this.life++;
    const windRad = (rendered.windDir * Math.PI) / 180;
    const ws = rendered.wind / 300;
    this.vx += Math.sin(windRad) * ws;
    this.vy -= Math.cos(windRad) * ws * 0.3;
    this.vx *= 0.98; this.vy *= 0.98;
    this.x += this.vx; this.y += this.vy;
    const lifeFrac = this.life / this.maxLife;
    this.alpha = Math.sin(lifeFrac * Math.PI) * this.targetAlpha;
    if (this.life > this.maxLife || this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) {
      this.init();
      this.x = Math.random() * W;
      this.y = Math.random() * H;
    }
  }
  draw() {
    const val = rendered[this.field];
    let str;
    if (this.field === 'windDir') str = Math.round(val) + '°';
    else if (this.field === 'temp') str = val.toFixed(1) + '°';
    else str = Math.round(val).toString();

    ctx.font = `${this.size}px 'Courier New', monospace`;
    ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
    ctx.fillText(str, this.x, this.y);
  }
}

const dataParticles = Array.from({ length: 80 }, () => new DataParticle());

// ═══════════════════════════════════════════
// VECTOR FIELD (wind arrows)
// ═══════════════════════════════════════════
function drawVectorField(v) {
  const cols = 22, rows = 14;
  const cw = W / cols, ch = H / rows;
  const windRad = (v.windDir * Math.PI) / 180;
  const strength = v.wind / 60;
  const yearProg = (year - 2025) / 75;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cx = (c + 0.5) * cw;
      const cy = (r + 0.5) * ch;
      const n = sn(c * 0.3, r * 0.3, globalT * 0.4);
      const angle = windRad + n * (0.8 + yearProg * 1.4);
      const len = 6 + strength * 18 + n * 8;

      const ex = cx + Math.sin(angle) * len;
      const ey = cy - Math.cos(angle) * len;

      const hue = colorHue(v) + n * 30;
      const alpha = 0.06 + strength * 0.08 + yearProg * 0.06;

      ctx.strokeStyle = `hsla(${hue}, 70%, 70%, ${alpha})`;
      ctx.lineWidth = 0.6 + strength * 0.4;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ex, ey);
      // arrowhead
      const ah = 0.4;
      ctx.lineTo(ex - Math.sin(angle - ah) * 5, ey + Math.cos(angle - ah) * 5);
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - Math.sin(angle + ah) * 5, ey + Math.cos(angle + ah) * 5);
      ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════
// TEMPERATURE WAVEFORM
// ═══════════════════════════════════════════
function drawTempWave(v) {
  const tempNorm = Math.max(0, Math.min(1, (v.temp + 10) / 55));
  const amp = 15 + tempNorm * 80 + (year - 2025) * 0.3;
  const freq = 0.006 + tempNorm * 0.012;
  const layers = 4;

  for (let l = 0; l < layers; l++) {
    const yBase = H * (0.25 + l * 0.17);
    const phase = globalT * (0.3 + l * 0.1) + l * 1.4;
    const hue = colorHue(v) + l * 20;
    const alpha = (0.08 - l * 0.015) + tempNorm * 0.04;

    ctx.strokeStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
    ctx.lineWidth = 1.5 - l * 0.3;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const n = sn(x * 0.008, l * 2, globalT * 0.2);
      const y = yBase + Math.sin(x * freq + phase) * amp + n * amp * 0.4;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════
// PRECIPITATION FIELD
// ═══════════════════════════════════════════
const precipPts = Array.from({ length: 600 }, () => ({
  x: Math.random(), y: Math.random(),
  s: 0.5 + Math.random() * 2.5,
  spd: 0.004 + Math.random() * 0.008,
  phase: Math.random() * Math.PI * 2,
}));

function drawPrecipField(v) {
  const intensity = Math.min(1, v.precip / 6);
  if (intensity < 0.01) return;
  const windRad = (v.windDir * Math.PI) / 180;
  const lean = Math.sin(windRad) * v.wind * 0.001;
  const hue = colorHue(v);

  // streaks for heavy, dots for light
  const heavy = intensity > 0.4;

  precipPts.forEach(p => {
    p.y += p.spd * intensity * (1 + (year - 2025) * 0.003);
    p.x += lean;
    if (p.y > 1) { p.y = -0.02; p.x = Math.random(); }
    if (p.x > 1) p.x -= 1;
    if (p.x < 0) p.x += 1;

    const px = p.x * W, py = p.y * H;
    const alpha = intensity * 0.4;

    if (heavy) {
      ctx.strokeStyle = `hsla(${hue + 40}, 60%, 75%, ${alpha})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + lean * W * 3, py + p.s * 14 * intensity);
      ctx.stroke();
    } else {
      ctx.fillStyle = `hsla(${hue + 30}, 50%, 70%, ${alpha * 0.6})`;
      ctx.beginPath();
      ctx.arc(px, py, p.s * intensity, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

// ═══════════════════════════════════════════
// CLOUD MASS (isoline contours)
// ═══════════════════════════════════════════
function drawCloudContours(v) {
  const cloudNorm = v.clouds / 100;
  if (cloudNorm < 0.1) return;
  const yearProg = (year - 2025) / 75;

  const levels = [0.1, 0.3, 0.5, 0.7];
  const step = 16;

  levels.forEach((level, li) => {
    const alpha = cloudNorm * 0.06 * (1 - li * 0.2);
    const hue = colorHue(v) + 40;
    ctx.strokeStyle = `hsla(${hue}, 30%, 80%, ${alpha})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    let drawing = false;
    for (let x = 0; x <= W; x += step) {
      for (let y = 0; y <= H; y += step) {
        const n = (sn(x * 0.004, y * 0.004, globalT * 0.15 + li) + 1) / 2;
        const cross = n > level;
        if (cross) {
          if (!drawing) { ctx.moveTo(x, y); drawing = true; }
          else ctx.lineTo(x, y);
        } else {
          drawing = false;
        }
      }
    }
    ctx.stroke();
  });
}

// ═══════════════════════════════════════════
// HEAT DISTORTION (future years)
// ═══════════════════════════════════════════
function drawHeatDistortion(v) {
  const yearProg = (year - 2025) / 75;
  const tempNorm = Math.max(0, (v.temp - 20) / 40);
  const strength = yearProg * tempNorm;
  if (strength < 0.05) return;

  const bands = Math.floor(6 + yearProg * 10);
  for (let i = 0; i < bands; i++) {
    const yPos = (i / bands) * H;
    const alpha = strength * 0.07 * Math.abs(Math.sin(globalT * 0.4 + i));
    const hue = colorHue(v);
    ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
    const wavH = 2 + strength * 6;
    const wavX = Math.sin(globalT * 1.2 + i * 2.3) * strength * 30;
    ctx.fillRect(wavX, yPos, W, wavH);
  }
}

// ═══════════════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════════════
function colorHue(v) {
  const tempNorm = Math.max(0, Math.min(1, (v.temp + 10) / 55));
  return 220 - tempNorm * 220;
}

function drawBackground(v) {
  const hue = colorHue(v);
  const tempNorm = Math.max(0, Math.min(1, (v.temp + 10) / 55));
  const yearProg = (year - 2025) / 75;
  const cloudDark = v.clouds / 100 * 4;
  const sat = 30 + tempNorm * 50 + yearProg * 15;
  const light = 4 + tempNorm * 6 + cloudDark;

  const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.6, Math.max(W, H) * 0.9);
  g.addColorStop(0,   `hsl(${hue}, ${sat}%, ${light + 5}%)`);
  g.addColorStop(0.5, `hsl(${hue + 25}, ${sat - 10}%, ${light}%)`);
  g.addColorStop(1,   `hsl(${hue + 50}, ${sat - 25}%, 2%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawVignette() {
  const g = ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,Math.max(W,H)*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════
let globalT = 0;

function loop() {
  globalT += 0.007;
  lerpState();

  const v = rendered;
  ctx.clearRect(0, 0, W, H);

  drawBackground(v);
  drawCloudContours(v);
  drawTempWave(v);
  drawVectorField(v);
  drawPrecipField(v);
  drawHeatDistortion(v);

  dataParticles.forEach(p => { p.update(); p.draw(); });

  drawVignette();

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
// UI
// ═══════════════════════════════════════════
function updateReadout() {
  const t = project('temp', year);
  const w = project('wind', year);
  const p = project('precip', year);
  const delta = t - base.temp;
  const yearProg = (year - 2025) / 75;

  document.getElementById('d-temp').textContent   = t.toFixed(1);
  document.getElementById('d-wind').textContent   = Math.round(w);
  document.getElementById('d-dir').textContent    = bearingLabel(base.windDir);
  document.getElementById('d-humid').textContent  = Math.round(base.humidity);
  document.getElementById('d-cloud').textContent  = Math.round(base.clouds);
  document.getElementById('d-precip').textContent = p.toFixed(2);
  document.getElementById('d-delta').textContent  = (delta >= 0 ? '+' : '') + delta.toFixed(2) + '°';

  const scenario = yearProg < 0.1 ? 'BASELINE' :
    yearProg < 0.3 ? 'NEAR FUTURE' :
    yearProg < 0.6 ? 'MID-CENTURY' : 'LATE CENTURY';
  document.getElementById('year-display').textContent =
    `YEAR ${year} — ${scenario}${delta > 0.5 ? ' · ▲ ' + delta.toFixed(1) + '°C' : ''}`;
}

function bearingLabel(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

document.getElementById('year-range').addEventListener('input', e => {
  year = parseInt(e.target.value);
  updateReadout();
});

// ═══════════════════════════════════════════
// EVOLVE playback
// ═══════════════════════════════════════════
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '■ STOP' : '▶ EVOLVE';
  if (playing) {
    playTimer = setInterval(() => {
      if (year < 2100) {
        year++;
        document.getElementById('year-range').value = year;
        updateReadout();
      } else {
        togglePlay();
      }
    }, 120);
  } else {
    clearInterval(playTimer);
  }
}

// ═══════════════════════════════════════════
// WEATHER FETCH
// ═══════════════════════════════════════════
const WMO = {
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm',99:'Thunderstorm'
};

function setStatus(msg, fade = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  if (fade) setTimeout(() => el.textContent = '', 3000);
}

async function geocode(city) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
  const d = await r.json();
  if (!d.results?.length) throw new Error('not found');
  return d.results[0];
}

async function fetchWeather(lat, lon) {
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=kmh`);
  return r.json();
}

async function loadCity(cityName) {
  setStatus('reading data streams...');
  try {
    const geo = await geocode(cityName);
    const data = await fetchWeather(geo.latitude, geo.longitude);
    const c = data.current;

    base.temp     = c.temperature_2m;
    base.humidity = c.relative_humidity_2m;
    base.precip   = c.precipitation;
    base.clouds   = c.cloud_cover;
    base.wind     = c.wind_speed_10m;
    base.windDir  = c.wind_direction_10m;

    const label = geo.name + (geo.country_code ? ` / ${geo.country_code}` : '');
    document.getElementById('city-label').textContent =
      `${label} · ${geo.latitude.toFixed(2)}°N ${Math.abs(geo.longitude).toFixed(2)}°${geo.longitude >= 0 ? 'E' : 'W'}`;
    document.getElementById('city-label').style.display = 'block';

    updateReadout();
    setStatus('');
  } catch {
    setStatus('city not found', true);
  }
}

function searchCity() {
  const v = document.getElementById('city-input').value.trim();
  if (v) loadCity(v);
}

function randomize() {
  const city = CITIES[Math.floor(Math.random() * CITIES.length)];
  const randYear = 2025 + Math.floor(Math.random() * 76);
  document.getElementById('city-input').value = city;
  document.getElementById('year-range').value = randYear;
  year = randYear;
  updateReadout();
  loadCity(city);
}

document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchCity();
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loop();
loadCity('New York');
</script>
</body>
</html>
