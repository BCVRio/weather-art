<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  overflow: hidden;
  font-family: 'Georgia', serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#ui {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 24px 32px;
  background: linear-gradient(transparent, rgba(0,0,0,0.5));
  pointer-events: none;
}

#weather-info {
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 0.05em;
}

#weather-info h2 {
  font-size: 22px;
  font-weight: normal;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.9);
  margin-bottom: 4px;
}

#metrics {
  display: flex;
  gap: 24px;
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-align: right;
}

.metric { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.metric-value { color: rgba(255,255,255,0.85); font-size: 18px; letter-spacing: 0.04em; }

#location-input {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  pointer-events: all;
  z-index: 10;
}

#location-input input {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  padding: 8px 16px;
  font-size: 13px;
  letter-spacing: 0.08em;
  outline: none;
  border-radius: 2px;
  width: 220px;
  transition: border-color 0.2s;
}

#location-input input:focus { border-color: rgba(255,255,255,0.5); }
#location-input input::placeholder { color: rgba(255,255,255,0.3); }

#location-input button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.7);
  padding: 8px 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}

#location-input button:hover { background: rgba(255,255,255,0.2); color: white; }

#status {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  letter-spacing: 0.1em;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="location-input">
  <input id="city-input" type="text" placeholder="City name..." value="New York" />
  <button onclick="searchCity()">RENDER</button>
</div>

<div id="status">loading weather...</div>

<div id="ui">
  <div id="weather-info">
    <h2 id="city-name">—</h2>
    <div id="condition">—</div>
  </div>
  <div id="metrics">
    <div class="metric">
      <span class="metric-value" id="temp-val">—</span>
      <span>TEMP °C</span>
    </div>
    <div class="metric">
      <span class="metric-value" id="wind-val">—</span>
      <span>WIND km/h</span>
    </div>
    <div class="metric">
      <span class="metric-value" id="humidity-val">—</span>
      <span>HUMIDITY %</span>
    </div>
    <div class="metric">
      <span class="metric-value" id="cloud-val">—</span>
      <span>CLOUD %</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Weather state ──
let weather = {
  temp: 20, wind: 10, windDir: 180,
  humidity: 60, clouds: 40, precip: 0,
  condition: 'clear'
};

// ── Particle system ──
const PARTICLE_COUNT = 600;
const particles = [];

class Particle {
  constructor() { this.reset(true); }

  reset(initial = false) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : (Math.random() < 0.5 ? -10 : H + 10);
    this.size = Math.random() * 3 + 0.5;
    this.life = Math.random();
    this.maxLife = 0.6 + Math.random() * 0.4;
    this.vx = 0;
    this.vy = 0;
    this.hue = 0;
    this.layer = Math.random(); // depth
  }

  update() {
    const windRad = (weather.windDir * Math.PI) / 180;
    const windStrength = weather.wind / 80;
    const tempNorm = (weather.temp + 20) / 70; // -20..50 → 0..1

    // Wind-driven movement with some turbulence
    const turb = (Math.random() - 0.5) * 0.4;
    this.vx += (Math.sin(windRad) * windStrength + turb) * 0.1;
    this.vy += (Math.cos(windRad) * windStrength * 0.3 + (Math.random() - 0.5) * 0.2) * 0.1;

    // Gravity for rain
    if (weather.precip > 0.5) {
      this.vy += weather.precip * 0.05;
      this.vx += (Math.sin(windRad) * windStrength) * 0.3;
    }

    this.vx *= 0.97;
    this.vy *= 0.97;

    this.x += this.vx;
    this.y += this.vy;

    this.life += 0.003 + weather.wind / 5000;

    // Color: cold (blue/cyan) → warm (orange/red)
    this.hue = 200 - tempNorm * 200; // 200=blue, 0=red

    if (this.life > this.maxLife || this.x < -50 || this.x > W + 50 || this.y > H + 50 || this.y < -50) {
      this.reset();
    }
  }

  draw() {
    const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.7;
    const saturation = 40 + weather.humidity * 0.4;
    const lightness = 50 + this.layer * 20;
    ctx.fillStyle = `hsla(${this.hue}, ${saturation}%, ${lightness}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (0.5 + this.layer * 0.8), 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

// ── Orbs (large atmospheric blobs) ──
const orbs = [];
for (let i = 0; i < 5; i++) {
  orbs.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 150 + Math.random() * 250,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.2,
    phase: Math.random() * Math.PI * 2,
  });
}

// ── Rain streaks ──
const rainDrops = [];
for (let i = 0; i < 200; i++) {
  rainDrops.push({
    x: Math.random() * W,
    y: Math.random() * H,
    len: 8 + Math.random() * 20,
    speed: 8 + Math.random() * 12,
  });
}

// ── Ripples ──
const ripples = [];

let frame = 0;

function drawBackground() {
  const tempNorm = Math.max(0, Math.min(1, (weather.temp + 20) / 70));
  const cloudNorm = weather.clouds / 100;

  // Base gradient driven by temperature
  const h1 = 200 - tempNorm * 200;
  const h2 = h1 + 40;
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.5, H);
  grad.addColorStop(0, `hsla(${h1}, 60%, ${8 + cloudNorm * 5}%, 1)`);
  grad.addColorStop(0.6, `hsla(${h2}, 50%, ${4 + cloudNorm * 3}%, 1)`);
  grad.addColorStop(1, `hsla(${h2 + 20}, 40%, 2%, 1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawOrbs() {
  const tempNorm = (weather.temp + 20) / 70;
  const windNorm = weather.wind / 100;

  orbs.forEach((o, i) => {
    o.phase += 0.003 + windNorm * 0.01;
    o.x += o.vx * (1 + windNorm * 2) + Math.sin(o.phase) * 0.3;
    o.y += o.vy + Math.cos(o.phase * 0.7) * 0.2;
    if (o.x < -o.r) o.x = W + o.r;
    if (o.x > W + o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = H + o.r;
    if (o.y > H + o.r) o.y = -o.r;

    const hue = (200 - tempNorm * 200 + i * 25) % 360;
    const alpha = 0.03 + weather.humidity / 800;
    const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
    grad.addColorStop(0, `hsla(${hue}, 70%, 60%, ${alpha})`);
    grad.addColorStop(1, `hsla(${hue}, 50%, 30%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawRain() {
  if (weather.precip < 0.5) return;
  const intensity = Math.min(1, weather.precip / 10);
  const windRad = (weather.windDir * Math.PI) / 180;
  const windLean = Math.sin(windRad) * weather.wind * 0.15;

  ctx.strokeStyle = `rgba(180, 210, 255, ${intensity * 0.35})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  rainDrops.forEach(d => {
    d.y += d.speed * intensity;
    d.x += windLean * 0.1;
    if (d.y > H + 20) { d.y = -20; d.x = Math.random() * W; }
    if (d.x > W + 20) d.x = 0;
    if (d.x < -20) d.x = W;
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + windLean * 0.5, d.y + d.len * intensity);
  });
  ctx.stroke();

  // Spawn ripples
  if (Math.random() < intensity * 0.3) {
    ripples.push({ x: Math.random() * W, y: H * 0.6 + Math.random() * H * 0.4, r: 0, alpha: 0.5 });
  }
}

function drawRipples() {
  ripples.forEach((r, i) => {
    r.r += 1.5;
    r.alpha -= 0.015;
    if (r.alpha <= 0) { ripples.splice(i, 1); return; }
    ctx.strokeStyle = `rgba(180, 210, 255, ${r.alpha * 0.4})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawFlowLines() {
  const windNorm = weather.wind / 100;
  if (windNorm < 0.05) return;

  const windRad = (weather.windDir * Math.PI) / 180;
  const tempNorm = (weather.temp + 20) / 70;
  const hue = 200 - tempNorm * 200;

  ctx.strokeStyle = `hsla(${hue}, 60%, 70%, ${windNorm * 0.12})`;
  ctx.lineWidth = 0.5;

  const step = 60;
  for (let y = 0; y < H; y += step) {
    ctx.beginPath();
    let px = -10, py = y + Math.sin(frame * 0.01 + y * 0.01) * 20;
    ctx.moveTo(px, py);
    while (px < W + 10) {
      const noise = Math.sin(px * 0.008 + frame * 0.005 + y * 0.003) * 30 * windNorm;
      px += 4 + windNorm * 4;
      py = y + noise + Math.sin(windRad) * windNorm * 15;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

function loop() {
  frame++;
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawOrbs();
  drawFlowLines();

  particles.forEach(p => { p.update(); p.draw(); });

  drawRain();
  drawRipples();

  requestAnimationFrame(loop);
}

// ── Weather fetching ──
async function geocode(city) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.results || data.results.length === 0) throw new Error('City not found');
  return data.results[0];
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=kmh`;
  const res = await fetch(url);
  return res.json();
}

const WMO_CONDITIONS = {
  0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
  45: 'Foggy', 48: 'Icy fog',
  51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
  61: 'Slight rain', 63: 'Rain', 65: 'Heavy rain',
  71: 'Slight snow', 73: 'Snow', 75: 'Heavy snow',
  80: 'Showers', 81: 'Rain showers', 82: 'Violent showers',
  95: 'Thunderstorm', 96: 'Thunderstorm w/ hail', 99: 'Thunderstorm w/ hail',
};

async function loadCity(cityName) {
  document.getElementById('status').textContent = 'fetching weather...';
  try {
    const geo = await geocode(cityName);
    const data = await fetchWeather(geo.latitude, geo.longitude);
    const c = data.current;

    weather.temp = c.temperature_2m;
    weather.humidity = c.relative_humidity_2m;
    weather.precip = c.precipitation;
    weather.clouds = c.cloud_cover;
    weather.wind = c.wind_speed_10m;
    weather.windDir = c.wind_direction_10m;

    document.getElementById('city-name').textContent = geo.name + (geo.country ? `, ${geo.country}` : '');
    document.getElementById('condition').textContent = WMO_CONDITIONS[c.weather_code] || 'Unknown';
    document.getElementById('temp-val').textContent = Math.round(c.temperature_2m);
    document.getElementById('wind-val').textContent = Math.round(c.wind_speed_10m);
    document.getElementById('humidity-val').textContent = c.relative_humidity_2m;
    document.getElementById('cloud-val').textContent = c.cloud_cover;
    document.getElementById('status').textContent = '';
  } catch (e) {
    document.getElementById('status').textContent = 'city not found — try again';
    setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
  }
}

function searchCity() {
  const val = document.getElementById('city-input').value.trim();
  if (val) loadCity(val);
}

document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchCity();
});

// ── Init ──
loop();
loadCity('New York');
</script>
</body>
</html>
